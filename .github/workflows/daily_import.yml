name: Importação Diária XML

on:
  schedule:
    - cron: '18 6 * * *'
      timezone: America/Sao_Paulo

    - cron: '12 13 * * *'
      timezone: America/Sao_Paulo

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install

      - name: Rodar Script de Importação
        run: node sync.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Manter repositório ativo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u > last-sync.txt
          git add last-sync.txt
          git commit -m "chore: atualiza status de sincronização automática [skip ci]" || exit 0
          git push
